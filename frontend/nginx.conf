# Nginx del frontend en Docker: sirve la aplicación React y reenvía la API a Spring Boot.
# El navegador solo habla con este servidor (mismo origen): no hace falta CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Igual que FastAPI: la foto más grande es de 5 MB
    client_max_body_size 6m;
    server_tokens off;

    # Toda la API pasa por la puerta de entrada Spring Boot (nunca directo a FastAPI ni a n8n)
    location /api/ {
        proxy_pass http://gateway:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se REEMPLAZA (no se agrega) la IP: el navegador no puede falsificarla enviando su propia cabecera
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;     # el asistente puede tardar varios segundos
    }

    location /uploads/ {
        proxy_pass http://gateway:8020;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Archivos con huella en el nombre (Vite): se pueden guardar en caché por un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier otra ruta (/asistente, /lugar/...) carga index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
