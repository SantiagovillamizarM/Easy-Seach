spring.application.name=easysearch-gateway

# Lee el mismo archivo .env de la raíz del proyecto (al correr desde gateway/ o desde la raíz).
# En Docker no hay .env: las variables llegan como variables de entorno y se usan igual.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Puerto de la puerta de entrada (el frontend solo habla con este puerto)
server.port=${GATEWAY_PORT:8020}
server.address=${GATEWAY_ADDRESS:127.0.0.1}

# Solo en producción detrás de Nginx: FORWARD_HEADERS_STRATEGY=native para leer la IP real de X-Forwarded-For.
# En desarrollo debe quedar en "none": el navegador llega por el proxy de Vite (127.0.0.1) y podría falsificarla.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# El proxy reenvía el cuerpo tal cual: Spring no debe leer ni interpretar los formularios o fotos
spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false

# --- Base de datos: la misma PostgreSQL que usa FastAPI (mismas variables del .env) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5440}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Las tablas las crean las migraciones (Alembic): Hibernate solo comprueba al arrancar que las entidades
# coinciden con las tablas reales, y si no coinciden la aplicación no arranca (mejor que fallar en producción).
spring.jpa.hibernate.ddl-auto=validate
# Cada consulta abre y cierra su propia conexión (no se mantiene abierta durante toda la petición)
spring.jpa.open-in-view=false

# --- Autenticación: la misma clave con la que FastAPI firma los tokens JWT ---
easysearch.jwt-secret=${SECRET_KEY}

# --- Backend FastAPI (búsqueda, cuentas, reseñas, panel...) ---
easysearch.fastapi-url=${FASTAPI_URL:http://127.0.0.1:8010}
# Tiempo máximo de espera por FastAPI (la búsqueda con IA puede tardar varios segundos)
easysearch.fastapi-timeout=${FASTAPI_TIMEOUT:60s}
# Igual que FastAPI: la foto más grande es de 5 MB, nada legítimo necesita más de 6 MB
easysearch.max-body-bytes=6291456

# Orígenes permitidos para CORS (los mismos que usa FastAPI)
easysearch.cors-origins=${CORS_ORIGINS:http://127.0.0.1:5173}

# --- Documentación interactiva: http://127.0.0.1:8020/swagger-ui.html ---
# Muestra en un solo lugar la API de Spring y la de FastAPI. En producción: SWAGGER_ENABLED=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.urls[0].name=Spring Boot (asistente, analitica, sistema)
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=FastAPI (busqueda, cuentas, resenas, paneles)
springdoc.swagger-ui.urls[1].url=/openapi.json
springdoc.swagger-ui.urls-primary-name=Spring Boot (asistente, analitica, sistema)
