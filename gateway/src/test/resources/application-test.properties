# Perfil de pruebas: no necesita PostgreSQL ni FastAPI encendidos.

# Clave fija de pruebas (la real del .env nunca se usa en las pruebas)
easysearch.jwt-secret=clave-solo-para-pruebas-automaticas-0123456789

# Sin base de datos real: Hibernate no se conecta al arrancar ni valida las tablas.
# Los repositorios se reemplazan por simulaciones (@MockitoBean) en las pruebas que los usan.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/no_existe
spring.datasource.username=pruebas
spring.datasource.password=pruebas
spring.datasource.hikari.connection-timeout=500
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# FastAPI apagado (las pruebas del proxy usan su propio FastAPI falso)
easysearch.fastapi-url=http://127.0.0.1:1
