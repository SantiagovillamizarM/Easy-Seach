# Perfil de pruebas de integración: base de datos de PRUEBAS real (<POSTGRES_DB>_test, la misma de pytest).
# Cada prueba corre en una transacción que se deshace al final: no deja datos.
# Requisitos: PostgreSQL encendido (docker compose up -d) y la base de pruebas migrada
# (se migra sola al correr las pruebas de FastAPI: cd backend; .\.venv\Scripts\python -m pytest).
spring.datasource.url=jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5440}/${POSTGRES_DB}_test
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Hibernate comprueba que las entidades coinciden con las tablas creadas por Alembic
spring.jpa.hibernate.ddl-auto=validate

# Límite bajo para poder probarlo
easysearch.asistente.consultas-por-hora=3
easysearch.asistente.openai-por-dia=2
easysearch.asistente.n8n-webhook-key=clave-webhook-de-pruebas
easysearch.asistente.timeout=3s
easysearch.fastapi-url=http://127.0.0.1:1
