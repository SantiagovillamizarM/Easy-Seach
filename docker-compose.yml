# Easy Search con Docker Compose.
#
#   docker compose up -d
#       Solo PostgreSQL + n8n. Para desarrollar: FastAPI, Spring Boot y Vite corren en tu PC (ver README).
#
#   docker compose --profile completo up -d --build
#       TODO el sistema en contenedores (PostgreSQL, n8n, FastAPI, Spring Boot y el frontend con Nginx).
#       La aplicación queda en http://127.0.0.1:8090. Detén antes los servidores de desarrollo (puertos 8010 y 8020).
#
# Recorrido de una petición:  navegador → frontend/Nginx (8090) → Spring Boot (8020) → FastAPI | n8n → PostgreSQL

# Red propia con IPs fijas: así cada servicio solo confía en la cabecera X-Forwarded-For (IP real del cliente)
# cuando viene del servicio anterior en la cadena, y nadie más puede falsificarla.
networks:
  easysearch:
    ipam:
      config:
        - subnet: 172.29.0.0/24

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: easysearch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts que se ejecutan SOLO la primera vez que se crea la base de datos
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      easysearch:
        ipv4_address: 172.29.0.5

  # Orquestador de los flujos de IA: indexación en pgvector y asistente RAG.
  # Interfaz en http://127.0.0.1:5690 (el 5678 lo usa otro proyecto). La primera vez pide crear una cuenta local.
  n8n:
    image: n8nio/n8n:2.48.7
    container_name: easysearch-n8n
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Crea credenciales desde el .env, importa y publica los flujos de n8n/workflows/ y arranca n8n
    entrypoint: ["/bin/sh", "/easysearch/arranque.sh"]
    environment:
      # Solo las variables que n8n necesita (no todo el .env)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      N8N_WEBHOOK_KEY: ${N8N_WEBHOOK_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.7}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
      # FastAPI en el puerto 8010 de la PC: sirve igual si corre en desarrollo o en su contenedor (modo completo)
      EASYSEARCH_FASTAPI_URL: ${N8N_FASTAPI_URL:-http://host.docker.internal:8010}
      # Clave con la que n8n cifra las credenciales que guarda (debe ser siempre la misma)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Los flujos leen la configuración NO secreta con $env (las claves van en credenciales)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_SECURE_COOKIE: "false"          # solo desarrollo local por http
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      # Las ejecuciones se guardan 7 días (sirven de evidencia y para depurar)
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    ports:
      - "127.0.0.1:${N8N_PORT:-5690}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/easysearch/workflows:ro
      - ./n8n/arranque.sh:/easysearch/arranque.sh:ro
      - ./n8n/credenciales.js:/easysearch/credenciales.js:ro
    networks:
      easysearch:
        ipv4_address: 172.29.0.6

  # ---------------------------------------------------------------- modo completo (--profile completo)

  # Backend FastAPI: aplica las migraciones al arrancar
  backend:
    profiles: ["completo"]
    build: ./backend
    image: easysearch-backend
    container_name: easysearch-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_URL: http://127.0.0.1:8090
      CORS_ORIGINS: http://127.0.0.1:8090
      # Solo la puerta de entrada (IP fija) puede indicar la IP real del cliente
      FORWARDED_ALLOW_IPS: 172.29.0.20
    ports:
      # Solo para n8n (lo llama por host.docker.internal) y para ver /docs; no es la entrada de la app
      - "127.0.0.1:8010:8010"
    volumes:
      - uploads:/easysearch/backend/uploads
      - modelos:/modelos
    networks:
      easysearch:
        ipv4_address: 172.29.0.10

  # Puerta de entrada Spring Boot: única API que ve el navegador
  gateway:
    profiles: ["completo"]
    build: ./gateway
    image: easysearch-gateway
    container_name: easysearch-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    environment:
      GATEWAY_ADDRESS: 0.0.0.0
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      FASTAPI_URL: http://backend:8010
      N8N_URL: http://n8n:5678
      CORS_ORIGINS: http://127.0.0.1:8090
      # Detrás de Nginx (frontend): lee la IP real que Nginx pone en X-Forwarded-For (solo de IPs internas)
      FORWARD_HEADERS_STRATEGY: native
    ports:
      - "127.0.0.1:8020:8020"     # Swagger: http://127.0.0.1:8020/swagger-ui.html
    networks:
      easysearch:
        ipv4_address: 172.29.0.20

  # Frontend React servido por Nginx
  frontend:
    profiles: ["completo"]
    build: ./frontend
    image: easysearch-frontend
    container_name: easysearch-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:8090:80"
    networks:
      easysearch:
        ipv4_address: 172.29.0.30

volumes:
  pgdata:
  n8ndata:
  uploads:
  modelos:
